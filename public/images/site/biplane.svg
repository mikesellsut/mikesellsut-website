<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <linearGradient id="fuselageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E03030"/>
      <stop offset="40%" stop-color="#C62828"/>
      <stop offset="100%" stop-color="#9E1E1E"/>
    </linearGradient>
    <linearGradient id="wingWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E0D4"/>
    </linearGradient>
    <linearGradient id="skyFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Contrails - flowing lines trailing behind the plane -->
  <path d="M10 95 Q40 94 80 92 Q120 90 155 88" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M20 103 Q50 102 85 100 Q125 98 158 96" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.65"/>
  <path d="M30 110 Q55 109 90 107 Q130 105 160 103" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.45"/>
  <!-- Fading contrail tails -->
  <path d="M0 96 Q4 95.5 10 95" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.3"/>
  <path d="M5 104 Q10 103.5 20 103" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.2"/>
  <path d="M12 111 Q18 110.5 30 110" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.15"/>

  <!-- === PLANE GROUP - angled slightly nose-up like the sign === -->
  <g transform="translate(160, 70) rotate(-8)">

    <!-- ====== TOP WING ====== -->
    <!-- Main wing surface - white like the sign -->
    <path d="M-75 -28 L80 -28 Q85 -28 85 -24 Q85 -20 80 -20 L-75 -20 Q-80 -20 -80 -24 Q-80 -28 -75 -28 Z"
          fill="url(#wingWhite)" stroke="#2A2A2A" stroke-width="1.2"/>
    <!-- Wing red tips -->
    <rect x="-80" y="-28" width="14" height="8" rx="3" fill="#C62828" stroke="#2A2A2A" stroke-width="0.8"/>
    <rect x="71" y="-28" width="14" height="8" rx="3" fill="#C62828" stroke="#2A2A2A" stroke-width="0.8"/>
    <!-- Wing ribs/fabric lines -->
    <line x1="-60" y1="-27" x2="-60" y2="-21" stroke="#CCC" stroke-width="0.5" opacity="0.6"/>
    <line x1="-40" y1="-27" x2="-40" y2="-21" stroke="#CCC" stroke-width="0.5" opacity="0.6"/>
    <line x1="-20" y1="-27" x2="-20" y2="-21" stroke="#CCC" stroke-width="0.5" opacity="0.6"/>
    <line x1="0" y1="-27" x2="0" y2="-21" stroke="#CCC" stroke-width="0.5" opacity="0.6"/>
    <line x1="20" y1="-27" x2="20" y2="-21" stroke="#CCC" stroke-width="0.5" opacity="0.6"/>
    <line x1="40" y1="-27" x2="40" y2="-21" stroke="#CCC" stroke-width="0.5" opacity="0.6"/>
    <line x1="60" y1="-27" x2="60" y2="-21" stroke="#CCC" stroke-width="0.5" opacity="0.6"/>

    <!-- ====== BOTTOM WING ====== -->
    <path d="M-65 12 L72 12 Q77 12 77 16 Q77 20 72 20 L-65 20 Q-70 20 -70 16 Q-70 12 -65 12 Z"
          fill="url(#wingWhite)" stroke="#2A2A2A" stroke-width="1.2"/>
    <!-- Wing red tips -->
    <rect x="-70" y="12" width="13" height="8" rx="3" fill="#C62828" stroke="#2A2A2A" stroke-width="0.8"/>
    <rect x="64" y="12" width="13" height="8" rx="3" fill="#C62828" stroke="#2A2A2A" stroke-width="0.8"/>
    <!-- Wing ribs -->
    <line x1="-50" y1="13" x2="-50" y2="19" stroke="#CCC" stroke-width="0.5" opacity="0.6"/>
    <line x1="-30" y1="13" x2="-30" y2="19" stroke="#CCC" stroke-width="0.5" opacity="0.6"/>
    <line x1="-10" y1="13" x2="-10" y2="19" stroke="#CCC" stroke-width="0.5" opacity="0.6"/>
    <line x1="10" y1="13" x2="10" y2="19" stroke="#CCC" stroke-width="0.5" opacity="0.6"/>
    <line x1="30" y1="13" x2="30" y2="19" stroke="#CCC" stroke-width="0.5" opacity="0.6"/>
    <line x1="50" y1="13" x2="50" y2="19" stroke="#CCC" stroke-width="0.5" opacity="0.6"/>

    <!-- ====== WING STRUTS ====== -->
    <!-- Left outer pair -->
    <line x1="-52" y1="-20" x2="-48" y2="12" stroke="#2A2A2A" stroke-width="2"/>
    <line x1="-45" y1="-20" x2="-41" y2="12" stroke="#2A2A2A" stroke-width="1.5"/>
    <!-- Cross wires left -->
    <line x1="-52" y1="-20" x2="-41" y2="12" stroke="#2A2A2A" stroke-width="0.5" opacity="0.5"/>
    <line x1="-45" y1="-20" x2="-48" y2="12" stroke="#2A2A2A" stroke-width="0.5" opacity="0.5"/>

    <!-- Right outer pair -->
    <line x1="45" y1="-20" x2="42" y2="12" stroke="#2A2A2A" stroke-width="2"/>
    <line x1="52" y1="-20" x2="49" y2="12" stroke="#2A2A2A" stroke-width="1.5"/>
    <!-- Cross wires right -->
    <line x1="45" y1="-20" x2="49" y2="12" stroke="#2A2A2A" stroke-width="0.5" opacity="0.5"/>
    <line x1="52" y1="-20" x2="42" y2="12" stroke="#2A2A2A" stroke-width="0.5" opacity="0.5"/>

    <!-- Center struts -->
    <line x1="-5" y1="-20" x2="-3" y2="12" stroke="#2A2A2A" stroke-width="1.8"/>
    <line x1="5" y1="-20" x2="3" y2="12" stroke="#2A2A2A" stroke-width="1.8"/>

    <!-- ====== FUSELAGE ====== -->
    <!-- Main body - red like the sign -->
    <path d="M-70 -6 Q-75 -4 -85 -2 L-95 0 Q-98 0 -98 -2 L-85 -6 Z"
          fill="#C62828" stroke="#2A2A2A" stroke-width="1"/>
    <path d="M-70 -8 L72 -8 Q80 -8 84 -2 L86 2 Q80 8 72 8 L-70 8 Q-76 4 -76 0 Q-76 -4 -70 -8 Z"
          fill="url(#fuselageGrad)" stroke="#2A2A2A" stroke-width="1.3"/>

    <!-- Fuselage highlight stripe -->
    <path d="M-65 -6 L70 -6 Q78 -6 82 -2" stroke="#E84040" stroke-width="1.5" fill="none" opacity="0.6"/>

    <!-- Fuselage bottom highlight -->
    <path d="M-65 6 L70 6" stroke="#8B1A1A" stroke-width="0.8" fill="none" opacity="0.5"/>

    <!-- ====== TAIL SECTION ====== -->
    <!-- Horizontal stabilizer -->
    <path d="M-82 -4 L-65 -4 L-65 4 L-82 4 Q-90 4 -92 0 Q-90 -4 -82 -4 Z"
          fill="#C62828" stroke="#2A2A2A" stroke-width="1"/>

    <!-- Vertical tail fin - tall like on sign -->
    <path d="M-72 -8 L-78 -38 Q-80 -42 -76 -42 L-66 -40 Q-64 -39 -65 -36 L-65 -8 Z"
          fill="#C62828" stroke="#2A2A2A" stroke-width="1.2"/>
    <!-- Rudder hinge line -->
    <line x1="-70" y1="-36" x2="-67" y2="-10" stroke="#2A2A2A" stroke-width="0.7" opacity="0.5"/>
    <!-- White stripe on tail -->
    <line x1="-75" y1="-34" x2="-66" y2="-32" stroke="#FFFFFF" stroke-width="2" opacity="0.6" stroke-linecap="round"/>

    <!-- ====== COCKPIT ====== -->
    <!-- Windscreen -->
    <path d="M18 -8 Q20 -16 26 -18 Q32 -18 34 -16 L36 -8"
          fill="#6BB5E8" stroke="#2A2A2A" stroke-width="1.2" opacity="0.85"/>
    <!-- Windscreen frame -->
    <line x1="27" y1="-17" x2="27" y2="-8" stroke="#2A2A2A" stroke-width="0.8"/>
    <!-- Cockpit opening behind windscreen -->
    <path d="M36 -8 L44 -8 L44 -4 Q40 -2 36 -4 Z" fill="#1B2E5A" stroke="#2A2A2A" stroke-width="0.8" opacity="0.6"/>

    <!-- ====== ENGINE SECTION ====== -->
    <!-- Engine cowling - dark, rounded like the sign -->
    <path d="M72 -10 Q82 -10 86 -4 L88 0 Q86 6 82 8 L72 8 L72 -10 Z"
          fill="#2A2A2A" stroke="#1A1A1A" stroke-width="1"/>
    <!-- Cowling details - cylinder bumps visible like radial engine -->
    <circle cx="84" cy="-5" r="2.5" fill="#333" stroke="#1A1A1A" stroke-width="0.5"/>
    <circle cx="86" cy="0" r="2.5" fill="#333" stroke="#1A1A1A" stroke-width="0.5"/>
    <circle cx="84" cy="5" r="2.5" fill="#333" stroke="#1A1A1A" stroke-width="0.5"/>
    <!-- Exhaust stacks -->
    <rect x="78" y="-12" width="3" height="3" rx="0.5" fill="#444" stroke="#333" stroke-width="0.5"/>
    <rect x="78" y="7" width="3" height="3" rx="0.5" fill="#444" stroke="#333" stroke-width="0.5"/>

    <!-- ====== PROPELLER ====== -->
    <!-- Spinner -->
    <ellipse cx="90" cy="0" rx="4" ry="3" fill="#444" stroke="#2A2A2A" stroke-width="0.8"/>
    <!-- Propeller blades - slightly blurred to suggest motion -->
    <ellipse cx="90" cy="-14" rx="3" ry="14" fill="#3A3020" opacity="0.7" transform="rotate(12,90,0)"/>
    <ellipse cx="90" cy="14" rx="3" ry="14" fill="#3A3020" opacity="0.7" transform="rotate(12,90,0)"/>
    <!-- Prop blur disc -->
    <circle cx="90" cy="0" r="16" fill="#666" opacity="0.06"/>

    <!-- ====== LANDING GEAR ====== -->
    <!-- Left strut -->
    <line x1="-8" y1="20" x2="-15" y2="38" stroke="#2A2A2A" stroke-width="2.5"/>
    <line x1="8" y1="20" x2="-5" y2="38" stroke="#2A2A2A" stroke-width="2"/>
    <!-- Axle -->
    <line x1="-22" y1="38" x2="2" y2="38" stroke="#2A2A2A" stroke-width="1.5"/>
    <!-- Left wheel -->
    <circle cx="-18" cy="40" r="6" fill="#2A2A2A"/>
    <circle cx="-18" cy="40" r="4" fill="#3A3A3A"/>
    <circle cx="-18" cy="40" r="1.5" fill="#555"/>
    <!-- Right wheel -->
    <circle cx="-2" cy="40" r="6" fill="#2A2A2A"/>
    <circle cx="-2" cy="40" r="4" fill="#3A3A3A"/>
    <circle cx="-2" cy="40" r="1.5" fill="#555"/>
    <!-- Wheel pants/fairings -->
    <path d="M-24 37 Q-18 34 -12 37" stroke="#C62828" stroke-width="1.5" fill="none"/>
    <path d="M-8 37 Q-2 34 4 37" stroke="#C62828" stroke-width="1.5" fill="none"/>

    <!-- Tail wheel strut -->
    <line x1="-78" y1="4" x2="-82" y2="14" stroke="#2A2A2A" stroke-width="1.2"/>
    <circle cx="-82" cy="16" r="2.5" fill="#2A2A2A"/>

  </g>
</svg>
